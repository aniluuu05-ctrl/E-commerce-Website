<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="css/cart.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
    rel="stylesheet"/>
</head>
<body>
    <header>
    <a href="#" class="logo">PESTICIDES</a>
    <div id = "cart-icon">
        <i class="ri-shopping-cart-2-line"></i>
        <span class="cart-item-count"></span>
    </div>
</header>
<div class="cart">
    <h2 class="cart-title">Your Cart</h2>
    <div class="cart-content"></div>
    <div class="total">
        <div class="total-title">Total</div>
        <div class="total-price">0</div>
    </div>
    <button class="btn-buy">Buy Now</button>
    <i class="ri-close-line" id="cart-close"></i>
</div>
<section class="shop">
    <h1 class="section-title">shop</h1>
    <div class="product-content">
        <div class="product-class">
            <div class="img-box">
                <img src="images/pesticde.png">
            </div>
            <div class="price-cart">
                <p id="101" class="product-title">junaco</p>
                <span class="price">10</span>
                <i class="ri-shopping-cart-2-line add-cart"></i>
            </div>
        </div>
        <div class="product-class">
            <div class="img-box">
                <img src="images/pesticide1.png">
            </div>
            <div class="price-cart">
                <p id="102" class="product-title">mimaco</p>
                <span class="price">15</span>
                <i class="ri-shopping-cart-2-line add-cart"></i>
            </div>
        </div>
        <div class="product-class">
            <div class="img-box">
                <img src="images/pesticide2.png">
            </div>
            <div class="price-cart">
                <p id="103" class="product-title">purgulamandu</p>
                <span class="price">20</span>
                <i class="ri-shopping-cart-2-line add-cart"></i>
            </div>
        </div>
        <div class="product-class">
            <div class="img-box">
                <img src="images/pesticide3.png">
            </div>
            <div class="price-cart">
                <p id="104" class="product-title">Colormandu</p>
                <span class="price">17</span>
                <i class="ri-shopping-cart-2-line add-cart"></i>
            </div>
        </div>
        <div class="product-class">
            <div class="img-box">
                <img src="images/pesticide4.png">
            </div>
            <div class="price-cart">
                <p id="105" class="product-title">Gaddimandu</p>
                <span class="price">30</span>
                <i class="ri-shopping-cart-2-line add-cart"></i>
            </div>
        </div>
        <div class="product-class">
            <div class="img-box">
                <img src="images/pesticide5.png">
            </div>
            <div class="price-cart">
                <p id="106" class="product-title">proteinMandu</p>
                <span class="price">18</span>
                <i class="ri-shopping-cart-2-line add-cart"></i>
            </div>
        </div>
    </div>
</section>
<script src="js/cart.js"></script>
</body>
</html>
